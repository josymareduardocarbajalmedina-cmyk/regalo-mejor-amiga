<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para ti, mi mejor amiga 💛</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020504;font-family:"Courier New",monospace}
body{color:#fff}
#stars,#fireflies{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.star,.fly{position:absolute;border-radius:50%;animation:float linear infinite}
.star{width:3px;height:3px;background:#fff;opacity:.8}
.fly{width:7px;height:7px;background:#fff700;box-shadow:0 0 16px #fff700;opacity:.75}
.page{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.panel{width:min(92vw,520px);text-align:center;z-index:2;padding:28px 18px}
.title{font-weight:900;color:#fff600;text-shadow:0 0 8px rgba(255,246,0,.25);font-size:clamp(29px,7vw,48px);line-height:1.35;letter-spacing:4px;animation:appear 1.3s ease both}
.subtitle{margin-top:25px;color:#fff600;font-size:clamp(20px,5vw,30px);letter-spacing:2px;animation:appear 1.7s ease both}
.desc{margin:55px auto 35px;color:white;font-size:clamp(18px,4.5vw,27px);line-height:1.55;font-weight:700;max-width:500px;animation:appear 2.1s ease both}
button{font:700 clamp(17px,4.5vw,24px) "Courier New",monospace;letter-spacing:2px;color:#fff600;background:rgba(20,25,0,.45);border:3px solid #fff600;border-radius:8px;padding:18px 28px;cursor:pointer;box-shadow:0 0 14px rgba(255,246,0,.65),inset 0 0 12px rgba(255,246,0,.08);transition:.25s}
button:active,button:hover{transform:scale(1.04);background:rgba(255,246,0,.08);box-shadow:0 0 25px rgba(255,246,0,.9)}
#garden{display:none;position:absolute;inset:0;z-index:3;background:radial-gradient(circle at 50% 75%,rgba(30,70,10,.2),transparent 45%),#020504}
.garden-text{position:absolute;top:6%;left:5%;right:5%;text-align:center;color:#fff600;font-weight:900;font-size:clamp(24px,6vw,44px);line-height:1.35;letter-spacing:2px;text-shadow:0 0 10px rgba(255,246,0,.3);opacity:0;animation:rise 1.5s 1.2s forwards}
.message{position:absolute;top:20%;left:7%;right:7%;text-align:center;color:#fff;font-size:clamp(16px,4vw,25px);line-height:1.5;font-weight:700;opacity:0;animation:rise 1.5s 2s forwards}
.ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(transparent,#031207)}
.flower{position:absolute;bottom:8%;width:90px;height:260px;transform-origin:bottom center;animation:sway 4s ease-in-out infinite}
.flower .stem{position:absolute;bottom:0;left:43px;width:10px;height:210px;background:linear-gradient(90deg,#063d12,#18a329,#063d12);border-radius:10px}
.flower .leaf{position:absolute;width:65px;height:28px;background:#075c18;border-radius:100% 0 100% 0}
.flower .l1{left:-5px;bottom:70px;transform:rotate(25deg)}
.flower .l2{right:-15px;bottom:110px;transform:rotate(-25deg) scaleX(-1)}
.flower .head{position:absolute;left:7px;bottom:195px;width:78px;height:58px}
.petal{position:absolute;width:45px;height:65px;background:#ffe600;border-radius:55% 55% 45% 45%;box-shadow:0 0 20px #fff000}
.p1{left:17px;top:0}.p2{left:0;top:18px;transform:rotate(-55deg)}.p3{right:0;top:18px;transform:rotate(55deg)}.p4{left:17px;top:24px;transform:rotate(180deg)}
.center{position:absolute;left:26px;top:22px;width:28px;height:28px;background:#7a4b00;border-radius:50%;z-index:2}
.f1{left:18%;animation-delay:.2s}.f2{left:42%;transform:scale(1.15);animation-delay:.7s}.f3{right:15%;transform:scale(.95);animation-delay:1.1s}
@keyframes float{from{transform:translateY(10vh)}to{transform:translateY(-110vh)}}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
</style>
</head>
<body>
<div id="stars"></div><div id="fireflies"></div>

<div class="page" id="home">
  <div class="panel">
    <div class="title">FELIZ DÍA<br>DE LAS<br>FLORES<br>AMARILLAS</div>
    <div class="subtitle">PARA TI, MI MEJOR AMIGA</div>
    <div class="desc">TENGO UN REGALO<br>ESPECIAL PARA TI</div>
    <button id="gift">VER TU REGALO</button>
  </div>
</div>

<section id="garden">
  <div class="garden-text">PARA TI, MI MEJOR AMIGA 💛</div>
  <div class="message">No encontré un ramo de flores amarillas lo suficientemente grande para reflejar lo mucho que vale tu amistad, por eso te programé esto. 💛🌻</div>
  <div class="ground"></div>
  <div class="flower f1"><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="head"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><b class="center"></b></div></div>
  <div class="flower f2"><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="head"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><b class="center"></b></div></div>
  <div class="flower f3"><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="head"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><b class="center"></b></div></div>
</section>

<script>
for(let i=0;i<55;i++){
  const s=document.createElement("span"); s.className="star";
  s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
  s.style.animationDuration=(5+Math.random()*8)+"s"; s.style.animationDelay=(-Math.random()*8)+"s";
  document.getElementById("stars").appendChild(s);
}
for(let i=0;i<38;i++){
  const f=document.createElement("span"); f.className="fly";
  f.style.left=Math.random()*100+"%"; f.style.top=(15+Math.random()*85)+"%";
  f.style.animationDuration=(7+Math.random()*10)+"s"; f.style.animationDelay=(-Math.random()*10)+"s";
  document.getElementById("fireflies").appendChild(f);
}
document.getElementById("gift").addEventListener("click",()=>{
  document.getElementById("home").style.display="none";
  document.getElementById("garden").style.display="block";
});
const audio = new Audio('ssstik.io_1789888840259.mp3');
document.addEventListener('click', () => { audio.play(); }, { once: true });
</script>
</body>
</html>
